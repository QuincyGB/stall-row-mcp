[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stall-row-mcp"
version = "0.1.1"
description = "MCP server for StallRow — the x402 utility row (wallet tools, verdicts, Verdict Index, packs) paid per call in USDC on Base"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ren, Verdict Row Patrol", email = "patrol@verdictrow.com" }]
keywords = ["mcp", "x402", "base", "usdc", "wallet", "agents"]
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer; this package targets the v1
    # SDK API that current MCP hosts and docs are built against.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "eth-account>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stall-row-mcp = "stall_row_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stall_row_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
